    <!-- <div class="demo">CONCEPT DIMOSTRATIVO · PRODOTTI E PREZZI NON REALI</div> -->
       <header><a class="logo" href="index.html"><i>H</i><span>HPRAM<small>JEWELRY · TRIESTE</small></span></a><button
            class="menu">MENU</button>
        <nav><a href="index.html">HOME</a><a href="boutique.html">BOUTIQUE</a><a href="catalogo.html">CATALOGO</a>

    <main>
        <section class="catalogHero">
            <p>CATALOGO</p>
            <h1>Gioielli e orologi.</h1>
            <!-- <span>Prodotti, nomi, disponibilità e prezzi sono fittizi e creati per la demo.</span> -->
        </section>
        <section class="catalogArea">
            <div class="tools"><input id="search" placeholder="Cerca prodotto o collezione">
                <div id="filters"></div><select id="sort">
                    <option value="featured">In evidenza</option>
                    <option value="low">Prezzo crescente</option>
                    <option value="high">Prezzo decrescente</option>
                    <option value="az">Nome A-Z</option>
                </select>
            </div>
            <div id="count"></div>
            <div id="grid" class="productGrid"></div>
            <p id="empty">Nessun prodotto trovato.</p>
        </section>
    </main>
<dialog id="modal">
    <button
        class="close"
        type="button"
        aria-label="Chiudi scheda prodotto"
    >
        ×
    </button>

    <div class="modalGrid">
        <img src="" alt="">

        <div class="modalContent">
            <p class="meta"></p>

            <h2></h2>

            <strong class="price"></strong>

            <p class="desc"></p>

            <dl>
                <div>
                    <dt>Codice demo</dt>
                    <dd class="code"></dd>
                </div>
            </dl>

            <a href="contatti.html" class="btn dark cont">
                RICHIEDI INFORMAZIONI
            </a>
        </div>
    </div>
</dialog>
